services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: due-diligence-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-diligence_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-diligence_password}
      POSTGRES_DB: ${DB_NAME:-due_diligence}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - due-diligence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-diligence_user} -d ${DB_NAME:-due_diligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: due-diligence-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - due-diligence-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: due-diligence-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      # Python Configuration
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      
      # Database Configuration
      DATABASE_URL: postgresql://${DB_USER:-diligence_user}:${DB_PASSWORD:-diligence_password}@postgres:5432/${DB_NAME:-due_diligence}
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      
      # Application Configuration
      HOST: 0.0.0.0
      PORT: ${PORT:-8000}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./uploads:/app/uploads
      - /home/rokon/Desktop/test/DueDiligence/data:/app/data
      - ./src:/app/src
    networks:
      - due-diligence-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  due-diligence-network:
    driver: bridge
